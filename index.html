<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Privacy DSR Assistant</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}label{display:block;margin:.4rem 0}select{padding:.4rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🔐 Privacy DSR Assistant</h1><p>Plan a data-subject request response.</p><label>Request type <select id="t"><option>Access</option><option>Deletion</option><option>Portability</option><option>Opt-out</option></select></label><label>Jurisdiction <select id="j"><option>GDPR (EU)</option><option>LGPD (Brazil)</option><option>CCPA/CPRA (California)</option></select></label><button onclick="go()">Generate plan</button><div id="out"></div><script>function go(){const t=document.getElementById('t').value,j=document.getElementById('j').value;const dl={'GDPR (EU)':'30 days','LGPD (Brazil)':'15 days','CCPA/CPRA (California)':'45 days'}[j];document.getElementById('out').textContent=`DSR Plan — ${t} under ${j}\nDeadline: ${dl}\nSteps:\n1. Verify requester identity (2-factor)\n2. Locate data across systems (CRM, billing, logs)\n3. ${t==='Deletion'?'Execute deletion + certify':'Compile portable export'}\n4. Respond with evidence log\n5. Archive for audit\n\nFull DSR automation: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/privacy-dsr-assistant">GitHub</a> · <a href="https://ziontechgroup.com/vendor-dpa-checker/">DPA Checker</a></p></body></html>
