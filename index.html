<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Privacy DSR Assistant</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}label{display:block;margin:.4rem 0}select{padding:.4rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🔐 Privacy DSR Assistant</h1><p>Plan a data-subject request workflow.</p><label>Request type <select id="t"><option>Access</option><option>Deletion</option><option>Portability</option><option>Rectification</option></select></label><label>Regulation <select id="r"><option>GDPR (30 days)</option><option>CCPA (45 days)</option><option>LGPD (15 days)</option></select></label><button onclick="go()">Generate plan</button><div id="out"></div><script>function go(){const t=document.getElementById('t').value,r=document.getElementById('r').value;document.getElementById('out').textContent=`DSR plan — ${t} under ${r}:\n1. Verify identity (2-factor check against records)\n2. Log request & start statutory clock\n3. Locate data across systems (CRM, support, billing, logs)\n4. ${t==='Deletion'?'Execute deletion + vendor cascade confirmations':t==='Access'?'Compile portable data package':'Generate corrected/exported dataset'}\n5. Respond to requester with evidence\n6. Archive proof for audit\n\nFully automated DSR pipeline: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/privacy-dsr-assistant">GitHub</a> · <a href="https://ziontechgroup.com/regulatory-change-radar/">Regulatory Radar</a></p></body></html>
